[package]
name = "qadren-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "qadren_core"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "qadren-worker"
path = "src/bin/qadren_worker.rs"

[features]
# Builds narrow test fixtures for native macOS acceptance. The production app
# never enables this feature.
ui-test-fixtures = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
libc = "0.2"
md5 = "0.7"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# On macOS 27, stripping compile-time proc-macro dylibs can make dyld reject
# them (mis-aligned LINKEDIT string pool / E0463 missing derive crate).
# Build dependencies are not shipped in QADREN.app.
[profile.release.build-override]
strip = false
